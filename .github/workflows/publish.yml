name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A142E4: ${{ secrets.A142E4 }}
          BB2CB4: ${{ secrets.BB2CB4 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A142E4', ''), os.environ.get('BB2CB4', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- c583a1f1bf98f6e0bb46bb5fa71d8993599d28bafbd32f -->', a)
          if b:
              patched = patched.replace('<!-- a05c16b20de97b0f3ef3a1ae555823 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
